<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>DEJOIY Seller App</title>
    <style>
      @keyframes dsa-spin { to { transform: rotate(360deg); } }
      @keyframes dsa-pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      #dsa-boot {
        position: fixed; inset: 0; z-index: 2147483000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; background: #0b0d14; color: #e8eaf2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        transition: opacity .35s ease;
      }
      #dsa-boot .dsa-logo {
        width: 56px; height: 56px; border-radius: 16px;
        background: linear-gradient(135deg, #7c3aed, #db2777);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 24px; letter-spacing: -.5px; color: #fff;
        box-shadow: 0 12px 40px rgba(124, 58, 237, .45);
      }
      #dsa-boot .dsa-name { font-size: 15px; font-weight: 650; opacity: .92; }
      #dsa-boot .dsa-name b { color: #a78bfa; font-weight: 750; }
      #dsa-boot .dsa-sub { font-size: 12px; opacity: .55; animation: dsa-pulse 1.4s ease-in-out infinite; }
      #dsa-boot .dsa-ring {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid rgba(167, 139, 250, .25); border-top-color: #a78bfa;
        animation: dsa-spin .8s linear infinite;
      }
      #dsa-boot.dsa-hide { opacity: 0; pointer-events: none; }
      #dsa-boot-fallback {
        display: none; position: fixed; inset: 0; z-index: 2147483001;
        align-items: center; justify-content: center; background: #0b0d14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      }
      #dsa-boot-fallback .card {
        max-width: 340px; margin: 16px; padding: 28px; border-radius: 18px; text-align: center;
        background: #141827; border: 1px solid rgba(167,139,250,.18); color: #e8eaf2;
        box-shadow: 0 24px 60px rgba(0,0,0,.5);
      }
      #dsa-boot-fallback h2 { margin: 0 0 8px; font-size: 17px; }
      #dsa-boot-fallback p { margin: 0 0 18px; font-size: 13px; opacity: .6; line-height: 1.5; }
      #dsa-boot-fallback button {
        padding: 10px 22px; border-radius: 10px; border: 0; cursor: pointer;
        background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff;
        font-weight: 650; font-size: 14px;
      }
      @media (prefers-reduced-motion: reduce) {
        #dsa-boot .dsa-ring { animation: none; }
        #dsa-boot .dsa-sub { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="dsa-boot" aria-hidden="true">
      <div class="dsa-logo">D</div>
      <div class="dsa-name"><b>DEJOIY</b> Seller App</div>
      <div class="dsa-ring" role="progressbar" aria-label="Loading"></div>
      <div class="dsa-sub">Loading your store…</div>
    </div>
    <div id="dsa-boot-fallback">
      <div class="card">
        <h2>App couldn't load</h2>
        <p>This is usually a stale cache or a dropped connection. A quick reload fixes it.</p>
        <button onclick="location.reload()">Reload App</button>
      </div>
    </div>
    <script>
      (function () {
        var shown = false;
        window.DSA_BOOT_FAIL = setTimeout(function () {
          shown = true;
          var b = document.getElementById('dsa-boot');
          if (b) b.style.display = 'none';
          document.getElementById('dsa-boot-fallback').style.display = 'flex';
        }, 12000);
        window.addEventListener('dsa-app-ready', function () {
          if (shown) return;
          clearTimeout(window.DSA_BOOT_FAIL);
          var b = document.getElementById('dsa-boot');
          if (b) { b.classList.add('dsa-hide'); setTimeout(function () { b.remove(); }, 400); }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
